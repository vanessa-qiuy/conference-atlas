<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#102f52"/>
  <meta name="description" content="Discover and track official academic conferences in public policy, public administration, and public management. Submission deadlines, registration dates, and conference calendar."/>
  <title>Conference Atlas — Discover. Track. Plan.</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
</head>
<body>
  <div id="app"><div class="initial-loading">Loading Conference Atlas…</div></div>
  <script>
    // GitHub Pages can cache a previous data/conferences.js even after deployment.
    // Request each asset with a fresh version so the status dashboard always uses
    // the same newly published snapshot as the rest of the site.
    (function () {
      'use strict';
      var version = Date.now().toString(36);
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = 'styles.css?v=' + version;
      document.head.appendChild(css);

      function showLoadError(message) {
        var root = document.getElementById('app');
        if (!root) return;
        root.textContent = '';
        var panel = document.createElement('div');
        panel.style.cssText = 'max-width:540px;margin:15vh auto;padding:30px;border:1px solid #d7e2ea;border-radius:16px;font:16px/1.6 system-ui,sans-serif;color:#24445f;background:#fff';
        var heading = document.createElement('h2');
        heading.textContent = 'Conference Atlas could not load the latest data';
        var detail = document.createElement('p');
        detail.textContent = message;
        var retry = document.createElement('button');
        retry.textContent = 'Try again';
        retry.style.cssText = 'padding:10px 18px;border:0;border-radius:8px;background:#234d73;color:white;cursor:pointer';
        retry.onclick = function () { window.location.reload(); };
        panel.appendChild(heading);
        panel.appendChild(detail);
        panel.appendChild(retry);
        root.appendChild(panel);
      }

      // Intentionally load data before the app to avoid silent empty monitoring
      // stats when a partially cached or older snapshot is returned.
      var dataset = document.createElement('script');
      dataset.src = 'data/conferences.js?v=' + version;
      dataset.onload = function () {
        var catalogue = window.ATLAS_DATA;
        if (!catalogue || !Array.isArray(catalogue.conferences) ||
            !catalogue.status || !Array.isArray(catalogue.status.sources)) {
          showLoadError('The conference database loaded without its monitoring summary. Please retry after the deployment finishes.');
          return;
        }
        var application = document.createElement('script');
        application.src = 'app.js?v=' + version;
        application.onerror = function () { showLoadError('The application could not be loaded. Please try again.'); };
        document.body.appendChild(application);
      };
      dataset.onerror = function () { showLoadError('The conference database could not be loaded. Please check the connection and retry.'); };
      document.body.appendChild(dataset);
    })();
  </script>
</body>
</html>
